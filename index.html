<!DOCTYPE html>

<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shri Enterprise | Wholesale General Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f7f7;
  color:#222;
  padding-bottom:80px;
}

header{
  background:#0f766e;
  color:white;
  text-align:center;
  padding:18px 15px;
  position:sticky;
  top:0;
  z-index:1000;
}

header h1{
  font-size:25px;
  margin-bottom:5px;
}

header p{
  font-size:13px;
}

.hero{
  background:white;
  text-align:center;
  padding:22px 15px;
}

.hero h2{
  font-size:24px;
  margin-bottom:8px;
}

.hero p{
  color:#555;
  margin-bottom:15px;
}

.whatsapp-btn{
  display:inline-block;
  background:#25D366;
  color:white;
  text-decoration:none;
  padding:12px 18px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px 12px;
}

.section-title{
  text-align:center;
  margin-bottom:18px;
}

.search-box{
  margin-bottom:15px;
}

.search-box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

#loading{
  text-align:center;
  padding:30px;
  color:#555;
}

#error{
  display:none;
  margin:20px 0;
  padding:15px;
  border-radius:8px;
  background:#ffe5e5;
  color:#b00020;
  text-align:center;
  word-break:break-word;
}

#products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.product{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
  display:flex;
  flex-direction:column;
}

.product img{
  width:100%;
  height:155px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:11px;
  display:flex;
  flex-direction:column;
  flex:1;
}

.product-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
}

.category{
  color:#777;
  font-size:12px;
  margin-bottom:6px;
}

.description{
  color:#555;
  font-size:12px;
  margin-bottom:7px;
  line-height:1.4;
}

.price{
  color:#0f766e;
  font-size:18px;
  font-weight:bold;
  margin-bottom:6px;
}

.stock{
  font-size:12px;
  margin-bottom:9px;
}

.order-btn{
  width:100%;
  border:none;
  background:#0f766e;
  color:white;
  padding:10px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
  margin-top:auto;
}

.order-btn:active{
  transform:scale(.98);
}

/* CART BAR */

.cart-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#0f766e;
  color:white;
  z-index:2000;
  padding:10px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.2);
}

.cart-info{
  font-size:13px;
}

.cart-total{
  font-size:18px;
  font-weight:bold;
}

.cart-button{
  background:white;
  color:#0f766e;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:3000;
  overflow-y:auto;
}

.modal-content{
  width:94%;
  max-width:550px;
  margin:25px auto;
  background:white;
  border-radius:14px;
  padding:17px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.close{
  border:none;
  background:none;
  font-size:30px;
  cursor:pointer;
}

.cart-item{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.cart-item-name{
  font-weight:bold;
  font-size:15px;
}

.cart-item-price{
  color:#0f766e;
  font-size:13px;
  margin-top:4px;
}

.qty-control{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:9px;
}

.qty-btn{
  width:32px;
  height:32px;
  border:none;
  border-radius:6px;
  background:#0f766e;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.remove-btn{
  border:none;
  background:#ffe5e5;
  color:#b00020;
  padding:7px 10px;
  border-radius:6px;
  margin-top:8px;
}

.cart-summary{
  text-align:right;
  padding:15px 0;
  font-size:19px;
  font-weight:bold;
}

.form-title{
  margin:12px 0;
}

.form-group{
  margin-bottom:11px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.form-group input,
.form-group textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

.form-group textarea{
  min-height:80px;
  resize:vertical;
}

.whatsapp-order{
  width:100%;
  border:none;
  background:#25D366;
  color:white;
  padding:14px;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:5px;
}

.empty-cart{
  text-align:center;
  padding:25px;
  color:#777;
}

footer{
  margin-top:30px;
  background:#0f766e;
  color:white;
  text-align:center;
  padding:20px;
}

@media(min-width:700px){
  #products{
    grid-template-columns:repeat(4,1fr);
  }

  .product img{
    height:180px;
  }
}
</style>

</head>

<body>

<header>
  <h1>Shri Enterprise</h1>
  <p>Wholesale General Store</p>
</header>

<section class="hero">
  <h2>हमारा Store</h2>

  <p>
    Products देखें, Cart में जोड़ें और WhatsApp पर Order करें।

<a
 class="whatsapp-btn"

<main class="container">

  </div>

<!-- CART BAR -->

<div class="cart-bar">

  <div>
    <div class="cart-info">
      🛒 Cart: <span id="cartCount">0</span> items
    </div>

<div class="cart-total">
  ₹<span id="cartTotal">0</span>
</div>
```

<button
 class="cart-button"
 onclick="openCart()">
View Cart </button>

</div>

<div
  class="modal"
  id="cartModal">

  <div class="modal-content">

<div class="modal-header">

  <h2>🛒 आपका Cart</h2>

  <button
    class="close"
    onclick="closeCart()">
    ×
  </button>

</div>

<div id="cartItems"></div>

<div class="form-group">

  <label>

  </label>

  <input

  </label>

  📲 WhatsApp पर Order भेजें

</button>
```

  </div>

</div>

<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL =
"https://hdgtecaamksqlgzhqpdk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_X2dpoV_vnElokGPIRRi40w_5RLGZPip";


/* =====================================================
   WHATSAPP NUMBER
   ===================================================== */

const WHATSAPP_NUMBER =
"918953176356";


/* =====================================================
   VARIABLES
   ===================================================== */

let allProducts = [];

let cart = [];


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts(){

  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("error");

  const productsBox =
    document.getElementById("products");


  try{

    /*
      यही वही table और columns हैं
      जो आपके current working code में हैं.
    */

    const url =
      SUPABASE_URL +
      "/rest/v1/Products" +
      "?select=id,name,price,image_url,category,description,stock";


    const response =
      await fetch(url,{

        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY,
          "Content-Type":
            "application/json"
        }

      });


    if(!response.ok){

      const errorText =
        await response.text();

      throw new Error(
        "Supabase Error " +
        response.status +
        ": " +
        errorText
      );

    }


    const products =
      await response.json();


    loading.style.display =
      "none";


    if(
      !Array.isArray(products) ||
      products.length === 0
    ){

      productsBox.innerHTML =
        "<p style='text-align:center;padding:30px;'>" +
        "Abhi koi product available nahi hai." +
        "</p>";

      return;

    }


    allProducts =
      products;


    displayProducts(allProducts);


  }
  catch(error){

    console.error(
      "Supabase connection error:",
      error
    );


    loading.style.display =
      "none";


    errorBox.style.display =
      "block";


    errorBox.innerHTML =
      "<b>Products load नहीं हो पाए।</b>" +
      "<br><br>" +
      escapeHtml(error.message);

  }

}


/* =====================================================
   DISPLAY PRODUCTS
   ===================================================== */

function displayProducts(products){

  const productsBox =
    document.getElementById("products");


  productsBox.innerHTML = "";


  if(products.length === 0){

    productsBox.innerHTML =
      "<p style='grid-column:1/-1;text-align:center;padding:30px;'>" +
      "कोई product नहीं मिला।" +
      "</p>";

    return;

  }


  products.forEach(function(product){

    const card =
      document.createElement("div");

    card.className =
      "product";


    const image =
      product.image_url &&
      product.image_url.trim() !== ""

      ? product.image_url

      : "https://placehold.co/600x600?text=Shri+Enterprise";


    const category =
      product.category || "";


    const description =
      product.description || "";


    const stock =
      product.stock !== null &&
      product.stock !== undefined

      ? product.stock

      : 0;


    card.innerHTML = `

      <img
        src="${escapeHtml(image)}"
        alt="${escapeHtml(product.name || "Product")}"
        onerror="this.src='https://placehold.co/600x600?text=Product'"
      >

      <div class="product-info">

        <div class="product-name">
          ${escapeHtml(product.name || "Product")}
        </div>

        ${
          category
          ?
          `<div class="category">
            ${escapeHtml(category)}
          </div>`
          :
          ""
        }

        ${
          description
          ?
          `<div class="description">
            ${escapeHtml(description)}
          </div>`
          :
          ""
        }

        <div class="price">
          ₹${Number(product.price || 0).toFixed(2)}
        </div>

        <div class="stock">
          Stock: ${escapeHtml(stock)}
        </div>

        <button
          class="order-btn"
          onclick="addToCart('${escapeJs(product.id)}')">

          🛒 Add to Cart

        </button>

      </div>
    `;


    productsBox.appendChild(card);

  });

}


/* =====================================================
   SEARCH
   ===================================================== */

function searchProducts(){

  const search =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayProducts(allProducts);

    return;

  }


  const filtered =
    allProducts.filter(function(product){

      const name =
        String(product.name || "")
          .toLowerCase();

      const category =
        String(product.category || "")
          .toLowerCase();

      const description =
        String(product.description || "")
          .toLowerCase();


      return(
        name.includes(search) ||
        category.includes(search) ||
        description.includes(search)
      );

    });


  displayProducts(filtered);

}


/* =====================================================
   ADD TO CART
   ===================================================== */

function addToCart(productId){

  const product =
    allProducts.find(function(item){

      return String(item.id) ===
        String(productId);

    });


  if(!product){

    alert("Product नहीं मिला।");

    return;

  }


  const existing =
    cart.find(function(item){

      return String(item.product.id) ===
        String(productId);

    });


  if(existing){

    existing.quantity++;

  }
  else{

    cart.push({

      product:product,

      quantity:1

    });

  }


  updateCart();


  alert(
    product.name +
    " cart में add हो गया।"
  );

}


/* =====================================================
   UPDATE CART
   ===================================================== */

function updateCart(){

  let count = 0;

  let total = 0;


  cart.forEach(function(item){

    count +=
      item.quantity;


    total +=
      Number(item.product.price || 0) *
      item.quantity;

  });


  document.getElementById("cartCount")
    .innerText = count;


  document.getElementById("cartTotal")
    .innerText =
      total.toLocaleString("en-IN");


  document.getElementById("modalTotal")
    .innerText =
      total.toLocaleString("en-IN");


  renderCart();

}


/* =====================================================
   RENDER CART
   ===================================================== */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(cart.length === 0){

    box.innerHTML =
      `<div class="empty-cart">
        आपका cart खाली है।
      </div>`;

    return;

  }


  box.innerHTML = "";


  cart.forEach(function(item,index){

    const product =
      item.product;


    const itemTotal =
      Number(product.price || 0) *
      item.quantity;


    const div =
      document.createElement("div");


    div.className =
      "cart-item";


    div.innerHTML = `

      <div class="cart-item-top">

        <div>

          <div class="cart-item-name">
            ${escapeHtml(product.name)}
          </div>

          <div class="cart-item-price">
            ₹${Number(product.price || 0).toFixed(2)}
            ×
            ${item.quantity}
            =
            ₹${itemTotal.toLocaleString("en-IN")}
          </div>

        </div>

      </div>


      <div class="qty-control">

        <button
          class="qty-btn"
          onclick="changeQuantity(${index},-1)">
          −
        </button>

        <b>
          ${item.quantity}
        </b>

        <button
          class="qty-btn"
          onclick="changeQuantity(${index},1)">
          +
        </button>

      </div>


      <button
        class="remove-btn"
        onclick="removeFromCart(${index})">

        Remove

      </button>

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   CHANGE QUANTITY
   ===================================================== */

function changeQuantity(index,change){

  if(!cart[index]){
    return;
  }


  cart[index].quantity +=
    change;


  if(cart[index].quantity <= 0){

    cart.splice(index,1);

  }


  updateCart();

}


/* =====================================================
   REMOVE
   ===================================================== */

function removeFromCart(index){

  cart.splice(index,1);

  updateCart();

}


/* =====================================================
   OPEN CART
   ===================================================== */

function openCart(){

  document.getElementById("cartModal")
    .style.display =
      "block";


  updateCart();

}


/* =====================================================
   CLOSE CART
   ===================================================== */

function closeCart(){

  document.getElementById("cartModal")
    .style.display =
      "none";

}


/* =====================================================
   SEND WHATSAPP ORDER
   ===================================================== */

function sendWhatsAppOrder(){

  if(cart.length === 0){

    alert(
      "पहले Cart में product add करें।"
    );

    return;

  }


  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const address =
    document
      .getElementById("customerAddress")
      .value
      .trim();


  if(!name){

    alert(
      "कृपया अपना नाम लिखें।"
    );

    return;

  }


  if(!phone){

    alert(
      "कृपया mobile number लिखें।"
    );

    return;

  }


  if(!address){

    alert(
      "कृपया पूरा address लिखें।"
    );

    return;

  }


  let total = 0;


  let message =
    "🛒 *NEW ORDER - SHRI ENTERPRISE*\n\n";


  message +=
    "*Customer Details*\n";

  message +=
    "Name: " +
    name +
    "\n";

  message +=
    "Mobile: " +
    phone +
    "\n";

  message +=
    "Address: " +
    address +
    "\n\n";


  message +=
    "*Order Items*\n";


  cart.forEach(function(item,index){

    const product =
      item.product;


    const price =
      Number(product.price || 0);


    const itemTotal =
      price *
      item.quantity;


    total +=
      itemTotal;


    message +=
      (index + 1) +
      ". " +
      product.name +
      "\n";

    message +=
      "   Qty: " +
      item.quantity +
      "\n";

    message +=
      "   Price: ₹" +
      price.toFixed(2) +
      "\n";

    message +=
      "   Amount: ₹" +
      itemTotal.toFixed(2) +
      "\n\n";

  });


  message +=
    "--------------------\n";


  message +=
    "*TOTAL: ₹" +
    total.toFixed(2) +
    "*\n\n";


  message +=
    "Please confirm my order.";


  const whatsappUrl =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    encodeURIComponent(message);


  window.open(
    whatsappUrl,
    "_blank"
  );

}


/* =====================================================
   HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,'\\"');

}


/* =====================================================
   CLOSE MODAL OUTSIDE
   ===================================================== */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById("cartModal");


    if(event.target === modal){

      closeCart();

    }

  }
);


/* =====================================================
   START WEBSITE
   ===================================================== */

loadProducts();

updateCart();

</script>

</body>
</html>
