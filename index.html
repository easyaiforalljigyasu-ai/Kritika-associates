<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shri Enterprise | Wholesale General Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f7;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    /* CART BUTTON */
    .cart-bar {
      background: white;
      padding: 12px 15px;
      text-align: right;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .cart-button {
      border: none;
      background: #0f766e;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 30px 15px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
      margin-bottom: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    #error {
      display: none;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #ffe5e5;
      color: #b00020;
      text-align: center;
      word-break: break-word;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .description {
      color: #555;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .price {
      color: #0f766e;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stock {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .add-cart-btn {
      width: 100%;
      border: none;
      background: #0f766e;
      color: white;
      padding: 11px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .add-cart-btn:active {
      transform: scale(0.98);
    }

    /* CART PANEL */

    #cartPanel {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
    }

    .cart-box {
      background: white;
      width: 94%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      margin: 5vh auto;
      border-radius: 12px;
      padding: 18px;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 12px;
    }

    .cart-header h2 {
      font-size: 22px;
    }

    .close-cart {
      border: none;
      background: #eee;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #0f766e;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-controls button {
      border: none;
      background: #0f766e;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity {
      min-width: 25px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      border: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 6px 8px;
      border-radius: 5px;
      cursor: pointer;
      height: 30px;
    }

    .cart-total {
      margin-top: 18px;
      padding-top: 15px;
      border-top: 2px solid #ddd;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
    }

    .whatsapp-order-btn {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      margin-top: 15px;
      cursor: pointer;
    }

    .empty-cart {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    footer {
      margin-top: 30px;
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (min-width: 700px) {
      #products {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Shri Enterprise</h1>
    <p>Wholesale General Store</p>
  </header>

  <!-- CART BAR -->
  <div class="cart-bar">
    <button class="cart-button" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>

  <section class="hero">
    <h2>हमारा Store</h2>
    <p>Products देखें और WhatsApp पर सीधे Order करें।</p>

    <a
      class="whatsapp-btn"
      href="https://wa.me/918953176356"
      target="_blank">
      WhatsApp पर संपर्क करें
    </a>
  </section>

  <main class="container">
