<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shri Enterprise | Wholesale General Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f7;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    /* CART TOP BAR */
    .cart-bar {
      background: white;
      padding: 10px 15px;
      text-align: right;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .cart-button {
      background: #0f766e;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 30px 15px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
      margin-bottom: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    #error {
      display: none;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #ffe5e5;
      color: #b00020;
      text-align: center;
      word-break: break-word;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .description {
      color: #555;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .price {
      color: #0f766e;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stock {
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* ADD TO CART BUTTON */
    .add-cart-btn {
      width: 100%;
      border: none;
      background: #0f766e;
      color: white;
      padding: 11px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .add-cart-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    /* CART POPUP */
    #cartPanel {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
      overflow-y: auto;
    }

    .cart-box {
      background: white;
      width: 94%;
      max-width: 500px;
      margin: 30px auto;
      border-radius: 12px;
      padding: 18px;
    }

    .cart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
      padding-bottom: 12px;
      margin-bottom: 10px;
    }

    .cart-header h2 {
      font-size: 22px;
    }

    .close-cart {
      width: 35px;
      height: 35px;
      border: none;
      border-radius: 50%;
      background: #eee;
      font-size: 22px;
      cursor: pointer;
    }

    .cart-item {
      border-bottom: 1px solid #eee;
      padding: 14px 0;
    }

    .cart-item-name {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .cart-item-price {
      color: #0f766e;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quantity-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 5px;
      background: #0f766e;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    .quantity-number {
      min-width: 30px;
      text-align: center;
      font-weight: bold;
    }

    .remove-btn {
      margin-left: auto;
      border: none;
      background: #ffe5e5;
      color: #b00020;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      border-top: 2px solid #ddd;
      margin-top: 15px;
      padding-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .whatsapp-cart-btn {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #25D366;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .empty-cart {
      text-align: center;
      padding: 30px 10px;
      color: #777;
    }

    footer {
      margin-top: 30px;
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (min-width: 700px) {
      #products {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Shri Enterprise</h1>
    <p>Wholesale General Store</p>
  </header>

  <!-- CART BUTTON -->
  <div class="cart-bar">
    <button class="cart-button" onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>
  </div>

  <section class="hero">
    <h2>हमारा Store</h2>
    <p>Products देखें और WhatsApp पर सीधे Order करें।</p>

    <a
      class="whatsapp-btn"
      href="https://wa.me/918953176356"
      target="_blank">
      WhatsApp पर संपर्क करें
    </a>
  </section>

  <main class="container">

    <h2 class="section-title">हमारे Products</h2>

    <div id="loading">
      Products loading...
    </div>

    <div id="error"></div>

    <div id="products"></div>

  </main>

  <footer>
    © 2026 Shri Enterprise
  </footer>


  <!-- CART PANEL -->

  <div id="cartPanel">

    <div class="cart-box">

      <div class="cart-header">
        <h2>🛒 आपका Cart</h2>

        <button
          class="close-cart"
          onclick="closeCart()">
          ×
        </button>
      </div>

      <div id="cartItems"></div>

      <div class="cart-total">
        <span>Total</span>
        <span>₹<span id="cartTotal">0.00</span></span>
      </div>

      <button
        class="whatsapp-cart-btn"
        onclick="orderCart()">
        📱 WhatsApp पर Order करें
      </button>

    </div>

  </div>



<script>

const SUPABASE_URL =
"https://hdgtecaamksqlgzhqpdk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_X2dpoV_vnElokGPIRRi40w_5RLGZPip";

async function loadProducts() {

  const loading =
    document.getElementById("loading");

  const products =
    document.getElementById("products");

  const error =
    document.getElementById("error");

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/Products?select=id,name,price,image_url,category,description,stock",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "Supabase Error: " +
        response.status
      );
    }

    const data = await response.json();

    loading.style.display = "none";

    if (!data || data.length === 0) {

      products.innerHTML =
        "<p style='text-align:center'>अभी कोई Product उपलब्ध नहीं है।</p>";

      return;
    }

    products.innerHTML = data.map(function(product) {

      return `
        <div class="product">

          <img
            src="${product.image_url || 'https://placehold.co/600x600?text=Shri+Enterprise'}"
            alt="${product.name || 'Product'}"
          >

          <div class="product-info">

            <div class="product-name">
              ${product.name || ""}
            </div>

            <div class="category">
              ${product.category || ""}
            </div>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="price">
              ₹${Number(product.price || 0).toFixed(2)}
            </div>

            <div class="stock">
              Stock: ${product.stock ?? 0}
            </div>

          </div>

        </div>
      `;

    }).join("");

  } catch (err) {

    loading.style.display = "none";

    error.style.display = "block";

    error.textContent =
      "Products load नहीं हो पाए: " +
      err.message;

    console.error(err);
  }
}

loadProducts();

</script>
