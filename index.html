<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shri Enterprise | Wholesale General Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7f7;
      color: #222;
    }

    header {
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    .hero {
      background: white;
      text-align: center;
      padding: 30px 15px;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #555;
      margin-bottom: 20px;
    }

    .whatsapp-btn {
      display: inline-block;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 13px 20px;
      border-radius: 8px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 20px;
    }

    #loading {
      text-align: center;
      padding: 30px;
      color: #555;
    }

    #error {
      display: none;
      margin: 20px 0;
      padding: 15px;
      border-radius: 8px;
      background: #ffe5e5;
      color: #b00020;
      text-align: center;
      word-break: break-word;
    }

    #products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      background: #eee;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .category {
      color: #777;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .description {
      color: #555;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .price {
      color: #0f766e;
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stock {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .order-btn {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 11px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      margin-top: 30px;
      background: #0f766e;
      color: white;
      text-align: center;
      padding: 20px;
    }

    @media (min-width: 700px) {
      #products {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Shri Enterprise</h1>
    <p>Wholesale General Store</p>
  </header>

  <section class="hero">
    <h2>हमारा Store</h2>
    <p>Products देखें और WhatsApp पर सीधे Order करें।</p>

    <a
      class="whatsapp-btn"
      href="https://wa.me/91XXXXXXXXXX"
      target="_blank">
      WhatsApp पर संपर्क करें
    </a>
  </section>

  <main class="container">

    <h2 class="section-title">हमारे Products</h2>

    <div id="loading">
      Products loading...
    </div>

    <div id="error"></div>

    <div id="products"></div>

  </main>

  <footer>
    © 2026 Shri Enterprise
  </footer>


<script>

/* =====================================================
   SUPABASE SETTINGS
   ===================================================== */

const SUPABASE_URL = "YOUR_SUPABASE_URL";

const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";


/* =====================================================
   WHATSAPP NUMBER
   India number: 91 + 10 digit mobile number
   Example: 919876543210
   ===================================================== */

const WHATSAPP_NUMBER = "91XXXXXXXXXX";


/* =====================================================
   LOAD PRODUCTS FROM SUPABASE
   ===================================================== */

async function loadProducts() {

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const productsBox = document.getElementById("products");

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/products?select=id,name,price,image_url,category,description,stock";

    const response = await fetch(url, {

      method: "GET",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      }

    });


    if (!response.ok) {

      const errorText = await response.text();

      throw new Error(
        "Supabase Error " +
        response.status +
        ": " +
        errorText
      );

    }


    const products = await response.json();


    loading.style.display = "none";


    if (!Array.isArray(products) || products.length === 0) {

      productsBox.innerHTML =
        "<p style='text-align:center;padding:30px;'>Abhi koi product available nahi hai.</p>";

      return;

    }


    productsBox.innerHTML = "";


    products.forEach(function(product) {

      const card = document.createElement("div");

      card.className = "product";


      const image =
        product.image_url && product.image_url.trim() !== ""
        ? product.image_url
        : "https://placehold.co/600x600?text=Shri+Enterprise";


      const category =
        product.category || "";


      const description =
        product.description || "";


      const stock =
        product.stock !== null && product.stock !== undefined
        ? product.stock
        : 0;


      card.innerHTML = `

        <img
          src="${escapeHtml(image)}"
          alt="${escapeHtml(product.name || "Product")}"
          onerror="this.src='https://placehold.co/600x600?text=Product'"
        >

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name || "Product")}
          </div>

          ${
            category
            ? `<div class="category">${escapeHtml(category)}</div>`
            : ""
          }

          ${
            description
            ? `<div class="description">${escapeHtml(description)}</div>`
            : ""
          }

          <div class="price">
            ₹${Number(product.price || 0).toFixed(2)}
          </div>

          <div class="stock">
            Stock: ${stock}
          </div>

          <button
            class="order-btn"
            onclick="orderProduct(
              '${escapeJs(product.name || "Product")}',
              '${Number(product.price || 0)}'
            )">
            WhatsApp पर Order करें
          </button>

        </div>
      `;


      productsBox.appendChild(card);

    });

  }


  catch (error) {

    console.error("Supabase connection error:", error);

    loading.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML =
      "<b>Products load नहीं हो पाए।</b><br><br>" +
      escapeHtml(error.message);

  }

}


/* =====================================================
   WHATSAPP ORDER
   ===================================================== */

function orderProduct(name, price) {

  const message =
    "नमस्ते Shri Enterprise,%0A%0A" +
    "मुझे यह product order करना है:%0A%0A" +
    "Product: " + encodeURIComponent(name) + "%0A" +
    "Price: ₹" + encodeURIComponent(price) + "%0A%0A" +
    "कृपया order confirm करें।";


  const whatsappUrl =
    "https://wa.me/" +
    WHATSAPP_NUMBER +
    "?text=" +
    message;


  window.open(whatsappUrl, "_blank");

}


/* =====================================================
   SECURITY / TEXT HELPERS
   ===================================================== */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function escapeJs(value) {

  return String(value)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'")
    .replace(/"/g, '\\"');

}


/* =====================================================
   START
   ===================================================== */

loadProducts();

</script>

</body>
</html>
